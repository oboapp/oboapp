name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check circular dependencies
        run: pnpm dlx dpdm@3.14.0 --no-tree --no-warning --exit-code circular:1 "db/src/**/*.ts" "shared/src/**/*.ts" "ingest/**/*.ts" "web/**/*.{ts,tsx}"

      - name: Check downstream identifier leakage
        run: |
          FORBIDDEN_REGEX='oborishte-map|oborishte-ingest'
          MATCHES=$(git grep -nE "$FORBIDDEN_REGEX" -- \
            ':!.github/workflows/ci.yml' \
            ':!**/.next/**' \
            ':!**/node_modules/**' \
            ':!**/dist/**' \
            ':!**/.env.local' \
            || true)

          if [ -n "$MATCHES" ]; then
            echo "::error::Found forbidden downstream identifiers in tracked files:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Check Terraform tfvars example schema drift
        run: |
          if grep -Eq '^[[:space:]]*#?[[:space:]]*(crawl_|ingest[[:space:]]*=|notify[[:space:]]*=)' ingest/terraform/terraform.tfvars.example; then
            echo "::error::ingest/terraform/terraform.tfvars.example still contains legacy schedule keys (crawl_*, ingest, notify)."
            exit 1
          fi

      - name: Install APM CLI (attempt 1)
        id: install_apm_attempt_1
        continue-on-error: true
        uses: microsoft/apm-action@v1
        with:
          apm-version: "0.8.11"

      - name: Install APM CLI (attempt 2)
        if: steps.install_apm_attempt_1.outcome == 'failure'
        uses: microsoft/apm-action@v1
        with:
          apm-version: "0.8.11"

      - name: Check APM install drift
        run: |
          apm install --force
          DRIFT=$(git status --porcelain -- apm.lock.yaml .github/agents/ .github/instructions/ .github/prompts/ .github/skills/ .claude/agents/ .claude/commands/ .claude/rules/ .claude/skills/)
          if [ -n "$DRIFT" ]; then
            echo "APM-managed files are out of date. Run 'pnpm apm:install' locally and commit the result."
            echo "$DRIFT"
            exit 1
          fi

      - name: Check for orphaned APM-deployed files
        run: |
          STATUS=0
          LOCKFILE=apm.lock.yaml

          if [ ! -f "$LOCKFILE" ]; then
            echo "::error::Missing $LOCKFILE. Run 'pnpm apm:install' and commit generated files."
            exit 1
          fi

          # Use APM-generated deployment outputs as source of truth.
          EXPECTED_DEPLOYED=$(awk '
            /^[[:space:]]*deployed_files:[[:space:]]*$/ { in_list=1; next }
            in_list && /^[[:space:]]*-[[:space:]]+/ { sub(/^[[:space:]]*-[[:space:]]+/, ""); print; next }
            in_list && !/^[[:space:]]*-[[:space:]]+/ { in_list=0 }
          ' "$LOCKFILE")

          if [ -z "$EXPECTED_DEPLOYED" ]; then
            echo "::error::No deployed_files entries found in $LOCKFILE."
            exit 1
          fi

          EXISTING_DEPLOYED=""

          for dir in .github/agents .github/instructions .github/prompts .claude/agents .claude/commands .claude/rules; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*.md; do
              [ -f "$f" ] || continue
              EXISTING_DEPLOYED="${EXISTING_DEPLOYED:+$EXISTING_DEPLOYED$'\n'}$f"
            done
          done

          for dir in .github/skills .claude/skills; do
            [ -d "$dir" ] || continue
            for d in "$dir"/*/; do
              [ -d "$d" ] || continue
              name="$(basename "$d")"
              path="$dir/$name"
              EXISTING_DEPLOYED="${EXISTING_DEPLOYED:+$EXISTING_DEPLOYED$'\n'}$path"
            done
          done

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! echo "$EXPECTED_DEPLOYED" | grep -Fxq "$path"; then
              echo "::error::Orphaned APM-deployed path: $path (not present in $LOCKFILE deployed_files)"
              STATUS=1
            fi
          done <<< "$EXISTING_DEPLOYED"

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "Orphaned APM-deployed paths found in .github/ or .claude/."
            echo "Delete the orphaned paths or run 'pnpm apm:install' and commit updated lockfile + outputs."
            exit 1
          fi
          echo "No orphaned APM files found."

  test-ingest:
    name: Test Ingest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check selected source configuration
        working-directory: ./ingest
        run: pnpm exec tsx scripts/check-source-config.ts

      - name: Build selected source implementations
        working-directory: ./ingest
        run: |
          pnpm build
          node dist/scripts/check-source-config.js

      - name: Prepare selected production dependencies
        run: node ingest/dist/scripts/prepare-production-workspace.js tmp/production-workspace

      - name: Verify frozen production installation
        working-directory: ./tmp/production-workspace
        run: pnpm install --frozen-lockfile --prod --ignore-scripts --offline

      - name: Run unit tests
        working-directory: ./ingest
        run: pnpm test:run

  test-source-image:
    name: Test Minimal Source Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build fixture and image verification commands
        run: pnpm --dir ingest build

      - name: Prepare isolated two-source image context
        run: node ingest/dist/scripts/prepare-source-image-fixture.js tmp/source-image

      - name: Build minimal Linux image
        run: docker build --progress=plain -t oboapp-source-image:ci -f tmp/source-image/ingest/Dockerfile tmp/source-image

      - name: Verify non-root runtime and selected image contents offline
        run: node ingest/dist/scripts/check-source-image.js oboapp-source-image:ci

  test-source-deployment:
    name: Test Source Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Initialize Terraform without a backend
        working-directory: ./ingest/terraform
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        working-directory: ./ingest/terraform
        run: terraform validate

      - name: Test source jobs and workflows
        working-directory: ./ingest/terraform
        run: terraform test

  test-web:
    name: Test Web
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: ./web
        run: pnpm test:run

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        working-directory: ./shared
        run: pnpm build

      - name: Next.js build
        working-directory: ./web
        env:
          NEXT_PUBLIC_LOCALITY: bg.sofia
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || 'http://localhost:3000' }}
          USE_FIREBASE_EMULATORS: "true"
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-project"
          PUBLIC_API_HOST: "https://api.example.com"
          # Sentry — all optional; omit secrets to disable Sentry for self-hosters
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm build

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [dependency-check, test-ingest, test-source-deployment, test-web, build-web]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate coverage reports
        run: pnpm test:coverage:sonar

      - name: SonarCloud Scan (push)
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=oboapp
            -Dsonar.projectKey=oboapp_oboapp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan (PR)
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=oboapp
            -Dsonar.projectKey=oboapp_oboapp
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
