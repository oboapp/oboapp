name: SonarCloud Fork PR Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  coverage:
    name: Fork coverage (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout fork head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Install and build workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate coverage reports
        run: pnpm test:coverage:sonar

      - name: Record artifact identity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("metadata.json").write_text(json.dumps({
              "pr": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }), encoding="utf-8")
          PY

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: |
            metadata.json
            api/coverage/lcov.info
            db/coverage/lcov.info
            ingest/coverage/lcov.info
            shared/coverage/lcov.info
            web/coverage/lcov.info
